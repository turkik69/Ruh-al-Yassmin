<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
  <meta name="theme-color" content="#1b2130" />
  <title>روح الياسمين</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand-wrap brand-button" onclick="setRoute('home')" aria-label="العودة للرئيسية">
        <div class="brand-mark"><img src="icon.svg" alt=""></div>
        <div>
          <h1>روح الياسمين</h1>
          <p>مختبرك الشخصي لصناعة العطور</p>
        </div>
      </button>
      <button class="brand-chip ai-chip" onclick="setRoute('assistant')">✦ AI</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-route="settings" class="nav-item"><span>⚙</span><small>الإعدادات</small></button>
      <button data-route="knowledge" class="nav-item"><span>▤</span><small>المعرفة</small></button>
      <button data-route="home" class="nav-item active nav-home"><span>⌂</span><small>الرئيسية</small></button>
      <button data-route="favorites" class="nav-item"><span>♡</span><small>المفضلة</small></button>
      <button data-route="profile" class="nav-item"><span>♙</span><small>حسابي</small></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
